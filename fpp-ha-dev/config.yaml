name: "FPP - Falcon Player (Dev)"
description: "Falcon Player (FPP) is a lightweight, optimized, feature-rich sequence player (Dev - always builds master branch locally, not prebuilt)"
version: "master"
slug: "fpp-ha-dev"
url: "https://github.com/jessica12ryan/fpp-ha"
stage: "experimental"

arch:
  - amd64
  - aarch64

startup: "services"
boot: "auto"

hostname: "fpp-docker"
host_network: true  # required for DDP/sACN multicast, mDNS, E1.31; non-breaking: FPP binds to host interfaces
host_ipc: true      # ALSA/PipeWire shared memory

apparmor: true      # see apparmor.txt (complain mode intentional, see note there)

# Privileged caps are minimal set for FPP hardware + network; each is
# required for production (GPIO/SPI/I2C, real-time audio, mount fallback).
# Do not remove without validating on target SBC hardware.
privileged:
  - SYS_ADMIN         # mount (bind mount persistence), GPIO
  - SYS_RAWIO         # /dev/mem, GPIO, I2C, SPI
  - SYS_NICE          # real-time priority for audio/light sequences
  - SYS_PTRACE        # debugging / profiling
  - SYS_RESOURCE      # resource limits for audio/rt
  - SYS_TIME          # NTP / system clock
  - DAC_READ_SEARCH   # bypass file read/search for FPP services
  - NET_ADMIN         # avahi, dnsmasq, hostapd, host_network
  - NET_RAW           # raw sockets (DDP, sACN/E1.31)
  - IPC_LOCK          # lock memory for audio streaming

webui: "http://[HOST]:[PORT:80]"
panel_icon: mdi:led-strip-variant

map:
  - type: data
    read_only: false
    path: /home/fpp/media
  - type: addon_config
    read_only: false

ports:
  80/tcp: 80 # Web UI
  4048/udp: 4048 # DDP
  5568/udp: 5568 # sACN/E1.31
  32320/udp: 32320 # FPP MultiSync
